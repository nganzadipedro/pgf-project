<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unidade Policial — Contacto</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div data-include="/partials/header.html"></div>

  <section class="hero">
    <div class="container">
      <span class="badge badge-accent">Fale Connosco</span>
      <h1 class="display-5" data-i18n="hero.contact.title">Contacto</h1>
      <p class="lead" data-i18n="hero.contact.lead">Estamos ao serviço. Fale connosco.</p>
    </div>
  </section>

  <section class="py-5">
    <div class="container">
      <div id="contactAlert" class="alert alert-success d-none" role="alert"></div>
      <div class="row g-4">
        <div class="col-12 col-lg-6">
          <form id="contactForm" class="card p-4">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label" data-i18n="contact.name">Nome Completo</label>
                <input name="name" type="text" class="form-control" required>
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label" data-i18n="contact.email">Email</label>
                <input name="email" type="email" class="form-control" required>
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label" data-i18n="contact.phone">Telefone</label>
                <input name="phone" type="tel" class="form-control">
              </div>
              <div class="col-12">
                <label class="form-label" data-i18n="contact.subject">Assunto</label>
                <input name="subject" type="text" class="form-control" required>
              </div>
              <div class="col-12">
                <label class="form-label" data-i18n="contact.message">Mensagem</label>
                <textarea name="message" class="form-control" rows="6" required></textarea>
              </div>
              <div class="col-12">
                <button class="btn btn-accent" type="submit" data-i18n="btn.send">Enviar</button>
              </div>
            </div>
          </form>
        </div>
        <div class="col-12 col-lg-6">
          <div class="card p-4 h-100">
            <h5>Quartel Central</h5>
            <p class="text-muted">Rua da Segurança, 123 — Cidade</p>
            <div class="ratio ratio-16x9 rounded overflow-hidden">
              <iframe src="https://maps.google.com/maps?q=Lisboa&t=&z=13&ie=UTF8&iwloc=&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div data-include="/partials/footer.html"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="/assets/js/i18n.js" defer></script>
  <script src="/assets/js/data.js" defer></script>
  <script src="/assets/js/main.js" defer></script>
  <script src="/assets/js/contact.js" defer></script>
</body>
</html>
